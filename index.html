<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deuxième Vie — Vendre, donner, trouver</title>
  <meta name="description" content="Fauteuils, lits, matelas, tables… Vendez ou donnez les objets que vous n'utilisez plus, près de chez vous.">
  <meta name="theme-color" content="#0A9396">
  <meta property="og:title" content="Deuxième Vie">
  <meta property="og:description" content="Vendez ou donnez vos meubles et objets. Les acheteurs vous appellent directement.">

<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#explorer" id="logo">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--mango)"/><path d="M11 24c0-5 4-9 9-9s9 4 9 9" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><rect x="9" y="23" width="22" height="6" rx="3" fill="var(--teal)"/><path d="M24 11c2-3 6-3 7 0-3 0-5 1-7 3" fill="var(--hibiscus)"/></svg>
        <span><b>Deuxième Vie</b><small>Vendre · Donner · Trouver</small></span>
      </a>
      <div class="spacer"></div>
      <button class="btn sun hide-sm" id="btnPublishTop" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Publier un article</button>
      <button class="btn primary" id="btnAccount">Se connecter</button>
      <button class="avatar" id="btnAvatar" hidden aria-label="Mon compte"></button>
    </div>
    <div class="tabs-scroll"><nav class="tabs" role="tablist" id="tabs"></nav></div>
  </div>
</header>
<div id="menuHost"></div>

<main id="main" class="wrap"></main>

<footer><div class="wrap">Deuxième Vie — les objets qui dorment chez vous font le bonheur de quelqu'un d'autre. Les échanges et paiements se font directement entre vendeur et acheteur : rencontrez-vous dans un lieu sûr et vérifiez l'article avant de payer.</div></footer>

<button class="btn sun fab" id="fab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Publier</button>
<div id="modalHost"></div>
<div id="toastHost"></div>

<noscript><p style="padding:16px">Activez JavaScript pour utiliser Deuxième Vie.</p></noscript>
<script type="module" src="app.js"></script>

</html>
